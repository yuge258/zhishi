name: Import HyperFrames Original

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import official HyperFrames into subfolder
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          git clone --depth 1 https://github.com/heygen-com/hyperframes.git "$tmpdir/hyperframes"
          rm -rf hyperframes
          mkdir -p hyperframes
          rsync -a --delete --exclude='.git/' "$tmpdir/hyperframes/" hyperframes/
          rm -rf "$tmpdir"

          # Remove the previous project files from main while keeping this temporary importer.
          for item in .* *; do
            case "$item" in
              .|..|.git|.github|hyperframes) ;;
              *) rm -rf -- "$item" ;;
            esac
          done

          # Preserve only workflow files needed for the migration itself.
          mkdir -p .github/workflows
          find .github/workflows -maxdepth 1 -type f ! -name 'import-hyperframes.yml' -delete

      - name: Commit imported original
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import official HyperFrames original source"
            git push origin HEAD:main
          fi
